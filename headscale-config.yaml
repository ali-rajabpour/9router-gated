# Headscale configuration. Mount via Dokploy File Mount at path
# "headscale-config.yaml" (see DEPLOY.md §C2).
#
# IMPORTANT: replace HEADSCALE_DOMAIN in server_url with your actual domain
# (e.g. https://headscale.example.com). Headscale reads this file literally;
# no environment variable substitution.

# Public URL clients connect to. Traefik terminates TLS here.
server_url: https://HEADSCALE_DOMAIN

# Listen inside the container; Traefik proxies to this.
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 127.0.0.1:9090
grpc_listen_addr: 127.0.0.1:50443
grpc_allow_insecure: false
trusted_proxies: []

noise:
  private_key_path: /var/lib/headscale/noise_private.key

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

derp:
  server:
    # Embedded DERP relay - relays traffic between mesh nodes over HTTPS
    # when direct WireGuard UDP can't connect (e.g. SNI-filtered networks).
    enabled: true
    region_id: 999
    region_code: "headscale"
    region_name: "Headscale Embedded DERP"
    # Only our own tailnet clients may use this relay.
    verify_clients: true
    # STUN address MUST be defined when the DERP server is enabled, but
    # we do NOT publish UDP 3478 from the container. STUN is therefore
    # unreachable, so clients skip direct-path discovery and relay through
    # DERP over HTTPS - pure HTTPS, maximum censorship resistance, no UDP.
    stun_listen_addr: "0.0.0.0:3478"
    private_key_path: /var/lib/headscale/derp_server_private.key
    automatically_add_embedded_derp_region: true
  # Do NOT use Tailscale's public DERP servers - they live on
  # derpN.tailscale.com which is SNI-filtered in some networks.
  urls: []
  paths: []
  auto_update_enabled: true
  update_frequency: 3h

disable_check_updates: false

node:
  # Nodes never expire (personal tailnet, few fixed machines).
  expiry: 0
  ephemeral:
    inactivity_timeout: 30m

database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite
    write_ahead_log: true
    wal_autocheckpoint: 1000

log:
  level: info
  format: text
