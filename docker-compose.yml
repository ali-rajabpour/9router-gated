# Tailscale access mode. For networks where Tailscale is filtered, deploy
# docker-compose.ssh.yml or docker-compose.headscale.yml instead; all three
# share the 9router-data volume.
services:
  # Tailscale sidecar owns the network namespace. Userspace mode on purpose:
  # no NET_ADMIN, no /dev/net/tun, nothing added to the host's networking.
  tailscale:
    image: ${TAILSCALE_IMAGE:-tailscale/tailscale:latest}
    restart: unless-stopped
    hostname: ${TAILSCALE_HOSTNAME:-9router}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
      # Tagged nodes have key expiry disabled, so the stack survives being
      # stopped for months without needing re-authentication.
      TS_EXTRA_ARGS: --advertise-tags=${TAILSCALE_TAG:-tag:nine-router}
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ../files/serve.json:/config/serve.json:ro

  9router:
    image: ${NINEROUTER_IMAGE:-decolua/9router:latest}
    pull_policy: always
    restart: unless-stopped
    # Shares the sidecar's netns. Reachable only via tailscale serve.
    network_mode: "service:tailscale"
    depends_on:
      - tailscale
    volumes:
      - 9router-data:/app/data
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      # serve sets X-Forwarded-Proto: https, so secure cookies are correct here.
      AUTH_COOKIE_SECURE: "true"
      JWT_SECRET: ${JWT_SECRET}
      INITIAL_PASSWORD: ${INITIAL_PASSWORD}
      # Internal self-call for the cloud sync job; stays inside the netns.
      BASE_URL: http://127.0.0.1:20128
      HEADROOM_URL: http://headroom:8787
      ENABLE_REQUEST_LOGS: "false"

  # Deliberately NOT in the tailscale netns. Sharing it would let this
  # third-party image reach 9router over 127.0.0.1 with no X-Forwarded-For,
  # which 9router treats as a local request: keyless /v1, password reset,
  # and the process-spawning routes all unlock. On the bridge it is just
  # another remote client.
  headroom:
    image: ${HEADROOM_IMAGE:-ghcr.io/chopratejas/headroom:latest}
    restart: unless-stopped
    expose:
      - "8787"

volumes:
  9router-data:
  tailscale-state:
