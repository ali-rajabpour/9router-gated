# Headscale access mode: join your own Headscale control plane (a central hub
# that serves all your private apps). This stack runs no control plane of its
# own. It ships one userspace Tailscale sidecar that registers with it
# (https://HUB_DOMAIN) using a single-use pre-auth key tagged tag:nine-router, and forwards mesh tcp/80 to 9router over the Docker bridge.
# 9router is reachable only from the mesh; nothing here is public.
#
# The control plane owns users, policy, keys and relays. It must provide a
# login server URL (HUB_DOMAIN), a single-use pre-auth key tagged tag:nine-router,
# and a policy granting the devices of user "owner" access to tag:nine-router on
# tcp/80 and nothing else. Device enrolment, node deletion and policy changes
# are control-plane operations too.
#
# Environment (Dokploy's Environment tab):
#   HUB_DOMAIN   public name of the control plane, e.g. hub.example.com (required)
#   TS_AUTHKEY   single-use tag:nine-router key (required). It is
#                consumed on first start only (TS_AUTH_ONCE + hub-state volume);
#                keep the spent value in place, an empty one fails the deploy.
#   JWT_SECRET, INITIAL_PASSWORD  9router secrets (required)
services:
  # Mesh client in userspace mode: no NET_ADMIN, no /dev/net/tun.
  sidecar:
    image: ${TAILSCALE_IMAGE:-tailscale/tailscale:v1.102.4}
    restart: unless-stopped
    depends_on:
      - 9router
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Forward over the Docker bridge, never to 127.0.0.1. A raw TCP forward
        # carries no X-Forwarded-For, so a connection from loopback looks local
        # to 9router and unlocks keyless /v1, password reset and the
        # process-spawning routes for every mesh peer. Arriving from this
        # container's bridge address it is an ordinary remote client.
        mkdir -p /config
        echo '{"TCP":{"80":{"TCPForward":"9router:20128"}}}' > /config/serve.json
        exec /usr/local/bin/containerboot
    environment:
      # Mesh name only (9router.<MagicDNS base>), set via TS_HOSTNAME and not the
      # compose `hostname:` key. A container hostname of 9router would add
      # "9router -> this container" to /etc/hosts, and the forward above would
      # dial the sidecar itself instead of the 9router service.
      TS_HOSTNAME: 9router
      # Tagged by the key (tag:nine-router), so no --advertise-tags here. Tagged
      # nodes never expire.
      TS_AUTHKEY: ${TS_AUTHKEY:?TS_AUTHKEY is required, a single-use tag:nine-router key}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
      TS_AUTH_ONCE: "true"
      TS_EXTRA_ARGS: --login-server=https://${HUB_DOMAIN:?HUB_DOMAIN is required, the control plane's public name} --accept-dns=false
    volumes:
      # Node identity, so the sidecar does not re-register after a restart.
      - hub-state:/var/lib/tailscale
    tmpfs: [/config, /tmp, /var/run]
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256m

  9router:
    image: ${NINEROUTER_IMAGE:-decolua/9router:0.5.75}
    restart: unless-stopped
    # Own network namespace on the stack's private bridge. No ports are
    # published; the sidecar is the only way in from the mesh.
    volumes:
      - 9router-data:/app/data
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      # Plain HTTP inside WireGuard, so the browser would never return a
      # Secure cookie.
      AUTH_COOKIE_SECURE: "false"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # Without it 9router falls back to 123456.
      INITIAL_PASSWORD: ${INITIAL_PASSWORD:?INITIAL_PASSWORD is required}
      BASE_URL: http://127.0.0.1:20128
      HEADROOM_URL: http://headroom:8787
      ENABLE_REQUEST_LOGS: "false"
    security_opt:
      - no-new-privileges:true

  # Separate container, so this third-party image reaches 9router over the
  # bridge like any remote client, never over 127.0.0.1.
  headroom:
    image: ${HEADROOM_IMAGE:-ghcr.io/headroomlabs-ai/headroom@sha256:35b799e94eef4644cb15a2e695b4b99698fe7668614623e9338cb10c10ececf9}
    restart: unless-stopped
    expose:
      - "8787"
    environment:
      # Headroom serves /v1/compress to loopback callers only, and 9router
      # calls it across the bridge without a token. Only 9router and the
      # sidecar share this network, and no mesh peer can reach port 8787.
      HEADROOM_COMPRESS_ALLOW_REMOTE: "1"
      # The default "coding" profile freezes earlier turns to keep Anthropic's
      # prefix cache warm, which saves little on providers routed through
      # 9router. "balanced" rewrites earlier turns losslessly and keeps the
      # last four intact; dedupe drops content repeated verbatim across turns.
      HEADROOM_SAVINGS_PROFILE: "balanced"
      HEADROOM_DEDUPE: "1"
    security_opt:
      - no-new-privileges:true

volumes:
  9router-data:
  hub-state:
