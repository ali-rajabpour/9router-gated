# Headscale access mode. Self-hosted Tailscale control plane on your own
# domain, for networks where *.tailscale.com is filtered. Everything a client
# sends travels as HTTPS on 443: control traffic and the embedded DERP relay
# both sit behind Traefik. 9router is reachable only from the mesh.
#
# Two Headscale users:
#   Routers  the sidecar below. Receives connections, never initiates them.
#   Devices  your laptops and phones. May reach Routers on tcp/80, and may
#            ping each other so they appear in each other's device list.
# No TCP or UDP between devices, and the router can reach none of them.
#
# One-shot actions, set in Dokploy's Environment tab and redeploy:
#   NEW_DEVICE=true         print a single-use key for Devices, valid 1 hour
#   DELETE_NODE_IDS="3 4"   delete nodes by ID (IDs are in the headscale log)
# Afterwards set NEW_DEVICE=false and empty DELETE_NODE_IDS, then redeploy.
services:
  # Control plane + embedded DERP relay. The only public service in the stack.
  # The -debug image is used because it ships busybox, which lets this one
  # container write its own config and bootstrap users and keys. The regular
  # image is distroless and would need two helper containers for the same job.
  headscale:
    image: ${HEADSCALE_IMAGE:-headscale/headscale:0.29.3-debug}
    restart: unless-stopped
    entrypoint: ["/busybox/sh", "-c"]
    command:
      - |
        mkdir -p /etc/headscale /var/run/headscale
        cat > /etc/headscale/config.yaml <<'EOF'
        server_url: https://${HEADSCALE_DOMAIN:?HEADSCALE_DOMAIN is required}
        listen_addr: 0.0.0.0:8080
        metrics_listen_addr: 127.0.0.1:9090
        grpc_listen_addr: 127.0.0.1:50443
        grpc_allow_insecure: false
        noise:
          private_key_path: /var/lib/headscale/noise_private.key
        prefixes:
          v4: 100.64.0.0/10
          v6: fd7a:115c:a1e0::/48
          allocation: sequential
        derp:
          server:
            enabled: true
            region_id: 999
            region_code: headscale
            region_name: Headscale Embedded DERP
            verify_clients: true
            # Required by Headscale, but UDP 3478 is not published, so every
            # client relays over HTTPS instead of attempting UDP.
            stun_listen_addr: 0.0.0.0:3478
            private_key_path: /var/lib/headscale/derp_server_private.key
            automatically_add_embedded_derp_region: true
          # Tailscale's public relays live on *.tailscale.com. Never use them.
          urls: []
          paths: []
          auto_update_enabled: false
        disable_check_updates: true
        dns:
          magic_dns: false
          override_local_dns: false
        node:
          expiry: 0
        database:
          type: sqlite
          sqlite:
            path: /var/lib/headscale/db.sqlite
            write_ahead_log: true
        policy:
          mode: file
          path: /etc/headscale/policy.json
        taildrop:
          enabled: false
        logtail:
          enabled: false
        log:
          level: info
        EOF

        # The policy names users that do not exist on a fresh database, so the
        # first boot starts deny-all and switches over once the users exist.
        allow='{"acls":[{"action":"accept","src":["Devices@"],"dst":["Routers@:80"]},{"action":"accept","proto":"icmp","src":["Devices@"],"dst":["Devices@:*"]}]}'
        if [ -f /var/lib/headscale/.users-ok ]; then echo "$$allow"; else echo '{"grants":[]}'; fi > /etc/headscale/policy.json

        rm -f /var/lib/headscale/.ready
        headscale serve &
        pid=$$!
        trap 'kill -TERM $$pid' TERM INT
        until headscale health >/dev/null 2>&1; do
          kill -0 $$pid 2>/dev/null || exit 1
          sleep 1
        done

        # No jq in busybox: drop quotes and whitespace, one object per line,
        # then take the id from the line whose name matches.
        uid() { headscale users list -o json | tr -d ' \n\t"' | tr '{}' '\n\n' | grep -E "(^|,)name:$$1(,|$$)" | grep -oE '(^|,)id:[0-9]+' | grep -oE '[0-9]+' | head -1; }
        key() { headscale preauthkeys create --user "$$(uid $$1)" --expiration 1h | grep -o 'hskey-auth-[A-Za-z0-9_-]*'; }

        for u in Routers Devices; do
          [ -n "$$(uid $$u)" ] || headscale users create $$u
        done
        if [ ! -f /var/lib/headscale/.users-ok ] && [ -n "$$(uid Routers)" ] && [ -n "$$(uid Devices)" ]; then
          echo "$$allow" > /etc/headscale/policy.json
          touch /var/lib/headscale/.users-ok
          kill -HUP $$pid
        fi

        for id in $$DELETE_NODE_IDS; do
          headscale nodes delete --identifier "$$id" --force
        done

        # The sidecar needs a key only until it has registered. Single use,
        # one hour, never printed.
        umask 077
        if headscale nodes list --user Routers -o json | grep -q '"id"'; then
          rm -f /router/key
        else
          key Routers > /router/key
        fi

        if [ "$$NEW_DEVICE" = true ]; then
          echo "========================================"
          echo "Single-use device key, valid 1 hour:"
          echo "  tailscale up --login-server=https://${HEADSCALE_DOMAIN} --accept-dns=false --auth-key=$$(key Devices)"
          echo "Set NEW_DEVICE=false in Dokploy when done."
          echo "========================================"
        fi

        headscale nodes list
        touch /var/lib/headscale/.ready
        wait $$pid
        wait $$pid
    environment:
      NEW_DEVICE: ${NEW_DEVICE:-}
      DELETE_NODE_IDS: ${DELETE_NODE_IDS:-}
    volumes:
      - headscale-data:/var/lib/headscale
      - router-key:/router
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "/busybox/sh", "-c", "test -f /var/lib/headscale/.ready && headscale health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256m
    labels:
      - traefik.enable=true
      - traefik.http.routers.headscale.rule=Host(`${HEADSCALE_DOMAIN}`)
      - traefik.http.routers.headscale.entrypoints=websecure
      # Empty when the certificate is uploaded in Dokploy (e.g. Cloudflare
      # Origin). Set CERT_RESOLVER=letsencrypt to use ACME instead.
      - traefik.http.routers.headscale.tls.certresolver=${CERT_RESOLVER:-}
      - traefik.http.routers.headscale.service=headscale-svc
      - traefik.http.services.headscale-svc.loadbalancer.server.port=8080

  # Mesh client in userspace mode: no NET_ADMIN, no /dev/net/tun.
  sidecar:
    image: ${TAILSCALE_IMAGE:-tailscale/tailscale:v1.102.3}
    restart: unless-stopped
    depends_on:
      headscale:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Forward over the Docker bridge, never to 127.0.0.1. A raw TCP forward
        # carries no X-Forwarded-For, so a connection from loopback looks local
        # to 9router and unlocks keyless /v1, password reset and the
        # process-spawning routes for every mesh peer. Arriving from this
        # container's bridge address it is an ordinary remote client.
        mkdir -p /config
        echo '{"TCP":{"80":{"TCPForward":"9router:20128"}}}' > /config/serve.json
        if [ -s /router/key ]; then export TS_AUTHKEY="$$(cat /router/key)"; fi
        exec /usr/local/bin/containerboot
    environment:
      # Mesh name only. A container hostname of 9router would add
      # "9router -> this container" to /etc/hosts, and the forward below would
      # dial the sidecar itself instead of the 9router service.
      TS_HOSTNAME: 9router
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
      TS_AUTH_ONCE: "true"
      TS_EXTRA_ARGS: --login-server=https://${HEADSCALE_DOMAIN} --accept-dns=false
    volumes:
      - sidecar-state:/var/lib/tailscale
      - router-key:/router:ro
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256m

  9router:
    image: ${NINEROUTER_IMAGE:-decolua/9router:0.5.75}
    restart: unless-stopped
    # Own network namespace on the stack's private bridge. No ports are
    # published; the sidecar is the only way in from the mesh.
    volumes:
      - 9router-data:/app/data
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      # Plain HTTP inside WireGuard, so the browser would never return a
      # Secure cookie.
      AUTH_COOKIE_SECURE: "false"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # Without it 9router falls back to 123456.
      INITIAL_PASSWORD: ${INITIAL_PASSWORD:?INITIAL_PASSWORD is required}
      BASE_URL: http://127.0.0.1:20128
      HEADROOM_URL: http://headroom:8787
      ENABLE_REQUEST_LOGS: "false"
    security_opt:
      - no-new-privileges:true

  # Separate container, so this third-party image reaches 9router over the
  # bridge like any remote client, never over 127.0.0.1.
  headroom:
    image: ${HEADROOM_IMAGE:-ghcr.io/headroomlabs-ai/headroom@sha256:35b799e94eef4644cb15a2e695b4b99698fe7668614623e9338cb10c10ececf9}
    restart: unless-stopped
    expose:
      - "8787"
    environment:
      # Headroom serves /v1/compress to loopback callers only, and 9router
      # calls it across the bridge without a token. Only 9router and the
      # sidecar share this network, and no mesh peer can reach port 8787.
      HEADROOM_COMPRESS_ALLOW_REMOTE: "1"
      # The default "coding" profile freezes earlier turns to keep Anthropic's
      # prefix cache warm, which saves little on providers routed through
      # 9router. "balanced" rewrites earlier turns losslessly and keeps the
      # last four intact; dedupe drops content repeated verbatim across turns.
      HEADROOM_SAVINGS_PROFILE: "balanced"
      HEADROOM_DEDUPE: "1"
    security_opt:
      - no-new-privileges:true

networks:
  dokploy-network:
    external: true

volumes:
  9router-data:
  sidecar-state:
  headscale-data:
  router-key:
