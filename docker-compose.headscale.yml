# Headscale access mode. Self-hosted Tailscale control plane on your own
# domain, for networks where *.tailscale.com is SNI-filtered. 9router is
# reachable only from the mesh, never public.
#
# Fully automated: the Headscale container creates the user and pre-auth key
# on first start and writes the key to a shared volume. The Tailscale sidecar
# picks it up automatically. No SSH to the VPS needed. The key is also
# printed to the Headscale container logs for visibility.
#
# All configuration is via environment variables - no file editing needed.
services:
  # Headscale control plane + embedded DERP relay. Public on your domain
  # via Traefik. This is the only public-facing service in the stack.
  # On first start, it also creates the Headscale user and pre-auth key
  # automatically, writing the key to a shared volume for the sidecar.
  headscale:
    image: ${HEADSCALE_IMAGE:-headscale/headscale:0.29.3}
    restart: unless-stopped
    # Override the image's ENTRYPOINT ["headscale"] so we can run a shell
    # script that substitutes HEADSCALE_DOMAIN, starts headscale, then
    # auto-creates the user and pre-auth key.
    entrypoint:
      - sh
      - -c
      - |
        sed "s|HEADSCALE_DOMAIN|${HEADSCALE_DOMAIN}|g" /etc/headscale/config-template.yaml > /etc/headscale/config.yaml
        headscale serve --config /etc/headscale/config.yaml &
        HEADSCALE_PID=$$!
        trap "kill $$HEADSCALE_PID" TERM INT
        until headscale --config /etc/headscale/config.yaml health 2>/dev/null; do sleep 2; done
        headscale --config /etc/headscale/config.yaml users create ${HEADSCALE_USER:-9router} 2>/dev/null || true
        if [ ! -f /shared/preauthkey ] || [ -z "$$(cat /shared/preauthkey)" ]; then
          KEY=$$(headscale --config /etc/headscale/config.yaml preauthkeys create --user ${HEADSCALE_USER:-9router} --reusable 2>&1 | grep -o 'tskey-auth-[a-zA-Z0-9_-]*')
          echo "$$KEY" > /shared/preauthkey
          echo "========================================"
          echo "Headscale pre-auth key created: $$KEY"
          echo "The Tailscale sidecar will use it automatically."
          echo "========================================"
        else
          echo "Using existing pre-auth key from previous deploy"
        fi
        wait $$HEADSCALE_PID
    expose:
      - "8080"
    networks:
      - dokploy-network
    volumes:
      - headscale-data:/var/lib/headscale
      - ../files/headscale-config.yaml.template:/etc/headscale/config-template.yaml:ro
      - shared:/shared
    healthcheck:
      test: ["CMD", "headscale", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512m
    labels:
      - traefik.enable=true
      - traefik.http.routers.headscale.rule=Host(`${HEADSCALE_DOMAIN}`)
      - traefik.http.routers.headscale.entrypoints=websecure
      - traefik.http.routers.headscale.tls.certresolver=letsencrypt
      - traefik.http.routers.headscale.service=headscale-svc
      - traefik.http.services.headscale-svc.loadbalancer.server.port=8080
      # HTTP -> HTTPS redirect
      - traefik.http.routers.headscale-http.rule=Host(`${HEADSCALE_DOMAIN}`)
      - traefik.http.routers.headscale-http.entrypoints=web
      - traefik.http.routers.headscale-http.middlewares=headscale-https-redirect
      - traefik.http.middlewares.headscale-https-redirect.redirectscheme.scheme=https

  # Tailscale sidecar, pointed at your Headscale instead of Tailscale's
  # hosted control plane. Userspace mode: no NET_ADMIN, no /dev/net/tun.
  # serve runs in HTTP mode (no HTTPS cert - Headscale does not support
  # per-node cert provisioning). WireGuard encrypts the transport; the
  # HTTP layer is just a proxy.
  #
  # If HS_AUTHKEY is not set, the sidecar waits for the pre-auth key file
  # written by the Headscale container above. Fully automatic.
  tailscale:
    image: ${TAILSCALE_IMAGE:-tailscale/tailscale:latest}
    restart: unless-stopped
    hostname: ${TAILSCALE_HOSTNAME:-9router}
    entrypoint:
      - sh
      - -c
      - |
        if [ -z "$${TS_AUTHKEY:-}" ]; then
          echo "Waiting for pre-auth key from Headscale..."
          while [ ! -f /shared/preauthkey ] || [ -z "$$(cat /shared/preauthkey 2>/dev/null)" ]; do sleep 2; done
          export TS_AUTHKEY=$$(cat /shared/preauthkey)
          echo "Pre-auth key found, starting Tailscale..."
        fi
        exec /usr/local/bin/containerboot
    environment:
      TS_AUTHKEY: ${HS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve-headscale.json
      TS_USERSPACE: "true"
      TS_EXTRA_ARGS: --login-server=https://${HEADSCALE_DOMAIN} --advertise-tags=${TAILSCALE_TAG:-tag:nine-router}
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ../files/serve-headscale.json:/config/serve-headscale.json:ro
      - shared:/shared:ro

  9router:
    image: ${NINEROUTER_IMAGE:-decolua/9router:latest}
    pull_policy: always
    restart: unless-stopped
    network_mode: "service:tailscale"
    depends_on:
      - tailscale
    volumes:
      - 9router-data:/app/data
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      AUTH_COOKIE_SECURE: "false"
      JWT_SECRET: ${JWT_SECRET}
      INITIAL_PASSWORD: ${INITIAL_PASSWORD}
      BASE_URL: http://127.0.0.1:20128
      HEADROOM_URL: http://headroom:8787
      ENABLE_REQUEST_LOGS: "false"

  headroom:
    image: ${HEADROOM_IMAGE:-ghcr.io/chopratejas/headroom:latest}
    restart: unless-stopped
    expose:
      - "8787"

networks:
  dokploy-network:
    external: true

volumes:
  9router-data:
  tailscale-state:
  headscale-data:
  shared:
